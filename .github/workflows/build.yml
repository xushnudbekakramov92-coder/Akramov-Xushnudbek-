name: APK Yigish
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Kodlarni yuklash
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Kutubxonalarni o'rnatish
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython==0.29.33 virtualenv

      - name: APK yig'ish
        run: |
          mkdir -p /tmp/buildozer
          sed -i 's|# build_dir = ./.buildozer|build_dir = /tmp/buildozer|g' buildozer.spec
          echo "build_dir = /tmp/buildozer" >> buildozer.spec
          buildozer android debug

      - name: APK faylini tekshirish
        run: ls -lh bin/

      - name: APK yuklash
        uses: actions/upload-artifact@v4
        with:
          name: ODTI-Energiya-APK
          path: bin/*.apk
