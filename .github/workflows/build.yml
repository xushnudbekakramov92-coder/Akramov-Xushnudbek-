name: ODTI Energiya APK Yigish

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodlarni yuklash
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kerakli paketlarni o'rnatish
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            build-essential libjpeg-dev

      - name: Buildozer o'rnatish
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0" "Cython==3.0.10" virtualenv

      - name: APK yig'ish
        run: |
          yes | buildozer -v android debug

      - name: APK faylini tekshirish
        run: |
          ls -lh bin/
          test -n "$(find bin -name '*.apk' -print -quit)"

      - name: APK yuklash
        uses: actions/upload-artifact@v4
        with:
          name: ODTI-Energiya-APK
          path: bin/*.apk
          if-no-files-found: error
